<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالمنا الخاص</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);

        h1 {
            color: #d81b60;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        img {
            max-width: 300px;
            height: auto;
            border-radius: 15px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>مرحباً بكم في عالمنا الخاص ✨</h1>
    <!-- رابط لصورة بالونات ملونة -->

</body>
</html>
